{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EUBUCCO — data sources across Europe</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    :root { --panel-bg: rgba(255,255,255,0.86); --panel-fg: #1f2328; --panel-line: rgba(0,0,0,0.10); }
    html.dark { --panel-bg: rgba(17,24,39,0.76); --panel-fg: #e6edf3; --panel-line: rgba(255,255,255,0.12); }
    html, body { margin: 0; height: 100%; background: #0f1623; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; z-index: 2; backdrop-filter: blur(8px); background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--panel-line); border-radius: 12px; }
    #title { top: 12px; left: 12px; padding: 9px 13px; max-width: 64%; }
    #title .eyebrow { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; font-weight: 700; }
    #title .name { font-size: 15px; font-weight: 750; line-height: 1.2; margin-top: 1px; }
    #title .sub { font-size: 11px; opacity: 0.72; margin-top: 2px; }
    #legend { bottom: 14px; left: 12px; padding: 10px 12px; font-size: 11px; }
    #legend .row { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
    #legend .row:first-of-type { margin-top: 7px; }
    #legend .swatch { width: 11px; height: 11px; border-radius: 3px; }
    #legend .lbl { font-weight: 600; opacity: 0.8; }
    #legend .hint { opacity: 0.6; font-size: 10px; max-width: 168px; line-height: 1.35; margin-top: 7px; }
    .tip { position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--panel-line); border-radius: 9px; padding: 8px 11px; font-size: 11px; white-space: nowrap; display: none; backdrop-filter: blur(8px); min-width: 178px; }
    .tip b { font-size: 12px; }
    .tip .count { opacity: 0.65; font-size: 10px; margin-top: 1px; }
    .tip .sect { font-size: 8.5px; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.5; font-weight: 700; margin-top: 8px; }
    .tip .mix { margin-top: 4px; display: grid; grid-template-columns: auto 1fr auto; gap: 3px 7px; align-items: center; }
    .tip .mix i { width: 8px; height: 8px; border-radius: 2px; }
    .tip .mix .v { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.85; }
    .tip .prov { margin-top: 4px; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
    .tip .prov .lab { opacity: 0.8; }
    .tip .prov .pbar { height: 7px; border-radius: 3px; overflow: hidden; background: rgba(127,127,127,0.22); display: flex; }
    .tip .prov .pbar i { height: 100%; }
    .tip .prov .gt { background: #2f8f78; } .tip .prov .mg { background: #79c4b1; } .tip .prov .es { background: #bfe3d9; }
    #loading { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; background: #0f1623; color: #9fb0cc; font-size: 13px; gap: 9px; transition: opacity .4s ease; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(159,176,204,0.3); border-top-color: #9fb0cc; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .maplibregl-ctrl-attrib { font-size: 10px !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title" class="panel">
    <div class="eyebrow">EUBUCCO · data provenance</div>
    <div class="name">Where building footprints come from</div>
    <div class="sub">Zoom in for finer NUTS levels</div>
  </div>
  <div id="legend" class="panel">
    <div class="row"><span class="swatch" style="background:#7dd3a0"></span><span class="lbl">Government</span></div>
    <div class="row"><span class="swatch" style="background:#5cb1c9"></span><span class="lbl">Microsoft</span></div>
    <div class="row"><span class="swatch" style="background:#e8b54a"></span><span class="lbl">OpenStreetMap</span></div>
    <div class="hint">Region colour is the weighted mix</div>
  </div>
  <div id="tip" class="tip"></div>
  <div id="loading"><span class="spinner"></span>Loading regions…</div>

<script>
const PMTILES_URL = "{{ pmtiles_url }}";
const MAP_STYLES = {
  dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
};
// Per-region fill = weighted blend of the three source colours by their share.
// gov #7dd3a0 (125,211,160) · msft #5cb1c9 (92,177,201) · osm #e8b54a (232,181,74)
const MIX_COLOR = ['let',
  'g', ['/', ['to-number', ['coalesce', ['get', 'source_gov_pct'], 0]], 100],
  'm', ['/', ['to-number', ['coalesce', ['get', 'source_msft_pct'], 0]], 100],
  'o', ['/', ['to-number', ['coalesce', ['get', 'source_osm_pct'], 0]], 100],
  ['rgb',
    ['min', 255, ['+', ['*', ['var', 'g'], 125], ['*', ['var', 'm'], 92], ['*', ['var', 'o'], 232]]],
    ['min', 255, ['+', ['*', ['var', 'g'], 211], ['*', ['var', 'm'], 177], ['*', ['var', 'o'], 181]]],
    ['min', 255, ['+', ['*', ['var', 'g'], 160], ['*', ['var', 'm'], 201], ['*', ['var', 'o'], 74]]],
  ]];

function storedTheme() {
  try {
    const q = new URLSearchParams(location.search).get('theme');
    if (q === 'light' || q === 'dark') return q;
    const t = localStorage.getItem('ui-theme');
    if (t === 'light' || t === 'dark') return t;
  } catch (e) {}
  return 'dark';
}
function applyHtmlTheme(m) { document.documentElement.classList.toggle('dark', m === 'dark'); }
applyHtmlTheme(storedTheme());
function styleUrl() { return storedTheme() === 'dark' ? MAP_STYLES.dark : MAP_STYLES.light; }

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const map = new maplibregl.Map({
  container: 'map', style: styleUrl(),
  // minZoom matches the pmtiles min zoom (3) so regions never vanish when zooming out.
  center: [9.5, 50], zoom: 3.4, minZoom: 3, maxZoom: 9,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

// Start at country level (NUTS0); reveal finer NUTS levels on zoom-in.
function levelForZoom(z) { return z < 3.8 ? 0 : z < 4.6 ? 1 : z < 5.6 ? 2 : 3; }
let level = levelForZoom(map.getZoom());
const levelFilter = () => ['==', ['get', 'nuts_level'], level];

function addLayers() {
  if (map.getSource('cov')) return;
  // promoteId lets us use GPU feature-state for hover (no per-move setFilter).
  map.addSource('cov', { type: 'vector', url: `pmtiles://${PMTILES_URL}`, promoteId: { stats: 'nuts_id' } });
  map.addLayer({
    id: 'mix-fill', type: 'fill', source: 'cov', 'source-layer': 'stats',
    filter: levelFilter(),
    paint: { 'fill-color': MIX_COLOR, 'fill-opacity': 0.82 },
  });
  map.addLayer({
    id: 'mix-line', type: 'line', source: 'cov', 'source-layer': 'stats',
    filter: levelFilter(),
    paint: { 'line-color': 'rgba(255,255,255,0.35)', 'line-width': ['interpolate', ['linear'], ['zoom'], 3, 0.2, 7, 0.6] },
  });
  map.addLayer({
    id: 'mix-hover', type: 'line', source: 'cov', 'source-layer': 'stats',
    filter: levelFilter(),
    paint: {
      'line-color': '#ffffff',
      'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 2, 0],
    },
  });
  document.getElementById('loading').classList.add('hidden');
}
map.on('style.load', addLayers);
map.on('load', () => setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1800));
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 8000);
map.on('error', e => console.error('map error', e && e.error));

// Switch NUTS level by zoom
map.on('zoomend', () => {
  const lv = levelForZoom(map.getZoom());
  if (lv === level || !map.getLayer('mix-fill')) return;
  level = lv;
  ['mix-fill', 'mix-line', 'mix-hover'].forEach(id => map.setFilter(id, levelFilter()));
});

// Hover: GPU feature-state highlight + tooltip with source mix and attribute provenance
const tip = document.getElementById('tip');
let hoveredId = null;
function setHover(id) {
  if (hoveredId === id) return;
  if (hoveredId !== null) map.setFeatureState({ source: 'cov', sourceLayer: 'stats', id: hoveredId }, { hover: false });
  hoveredId = id;
  if (hoveredId !== null) map.setFeatureState({ source: 'cov', sourceLayer: 'stats', id: hoveredId }, { hover: true });
}
const num = (v) => Math.max(0, +v || 0);
function provRow(label, gt, mg, es) {
  return '<span class="lab">' + label + '</span><span class="pbar">' +
    '<i class="gt" style="width:' + num(gt) + '%"></i>' +
    '<i class="mg" style="width:' + num(mg) + '%"></i>' +
    '<i class="es" style="width:' + num(es) + '%"></i></span>';
}
map.on('mousemove', 'mix-fill', (e) => {
  const f = e.features[0]; if (!f) return;
  const p = f.properties;
  map.getCanvas().style.cursor = 'pointer';
  setHover(f.id);
  const mix = (c, label, v) => '<i style="background:' + c + '"></i><span>' + label + '</span><span class="v">' + num(v).toFixed(0) + '%</span>';
  tip.style.display = 'block';
  tip.style.left = e.point.x + 'px';
  tip.style.top = e.point.y + 'px';
  tip.innerHTML =
    '<b>' + (p.name || p.nuts_id) + '</b>' +
    '<div class="count">' + Number(p.building_count || 0).toLocaleString() + ' buildings</div>' +
    '<div class="sect">Data sources</div>' +
    '<div class="mix">' +
      mix('#7dd3a0', 'Government', p.source_gov_pct) +
      mix('#5cb1c9', 'Microsoft', p.source_msft_pct) +
      mix('#e8b54a', 'OpenStreetMap', p.source_osm_pct) +
    '</div>' +
    '<div class="sect">Attribute provenance</div>' +
    '<div class="prov">' +
      provRow('Type', p.type_gt_pct, p.type_merged_pct, p.type_est_pct) +
      provRow('Subtype', p.subtype_gt_pct, p.subtype_merged_pct, p.subtype_est_pct) +
      provRow('Height', p.height_gt_pct, p.height_merged_pct, p.height_est_pct) +
      provRow('Floors', p.floors_gt_pct, p.floors_merged_pct, p.floors_est_pct) +
      provRow('Year', p.construction_year_gt_pct, p.construction_year_merged_pct, p.construction_year_est_pct) +
    '</div>';
});
map.on('mouseleave', 'mix-fill', () => {
  tip.style.display = 'none';
  map.getCanvas().style.cursor = '';
  setHover(null);
});

// Follow the site light/dark toggle by swapping ONLY the basemap and carrying
// our source + region layers across with transformStyle, so the custom layers
// are never torn down (avoids both the "no tile manager" throw and a full
// iframe reload, which would churn WebGL contexts on a page with two maps).
function setTheme(m) {
  applyHtmlTheme(m);
  hoveredId = null;
  map.setStyle(m === 'dark' ? MAP_STYLES.dark : MAP_STYLES.light, {
    transformStyle: (prev, next) => {
      if (!prev) return next;
      const sources = { ...next.sources };
      if (prev.sources && prev.sources.cov) sources.cov = prev.sources.cov;
      const keep = (prev.layers || []).filter((l) => l.id && l.id.indexOf('mix-') === 0);
      return { ...next, sources, layers: [...(next.layers || []), ...keep] };
    },
  });
}
window.addEventListener('storage', (e) => {
  if (e.key !== 'ui-theme' || !e.newValue) return;
  setTheme(e.newValue === 'light' ? 'light' : 'dark');
});
map.getCanvas().addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  const el = document.getElementById('loading');
  el.classList.remove('hidden');
  el.textContent = 'Map paused (graphics context lost) — reload the page to view.';
}, false);
</script>
</body>
</html>
