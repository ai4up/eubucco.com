{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EUBUCCO — buildings across Europe</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js"></script>
  <style>
    :root { --panel-bg: rgba(255,255,255,0.85); --panel-fg: #1f2328; --panel-line: rgba(0,0,0,0.10); }
    html.dark { --panel-bg: rgba(17,24,39,0.74); --panel-fg: #e6edf3; --panel-line: rgba(255,255,255,0.12); }
    html, body { margin: 0; height: 100%; background: #0f1623; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 2; backdrop-filter: blur(8px);
      background: var(--panel-bg); color: var(--panel-fg);
      border: 1px solid var(--panel-line); border-radius: 12px;
    }
    #title { top: 12px; left: 12px; padding: 9px 13px; max-width: 62%; }
    #title .eyebrow { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; font-weight: 700; }
    #title .name { font-size: 15px; font-weight: 750; line-height: 1.2; margin-top: 1px; }
    #title .sub { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    #legend { bottom: 14px; left: 12px; padding: 9px 12px; font-size: 11px; }
    #legend .row { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
    #legend .row:first-of-type { margin-top: 6px; }
    #legend .dot { width: 10px; height: 10px; border-radius: 50%; }
    #legend .lbl { font-weight: 600; opacity: 0.75; }
    .tip {
      position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 12px));
      background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--panel-line);
      border-radius: 8px; padding: 5px 9px; font-size: 11px; white-space: nowrap; display: none;
      backdrop-filter: blur(8px);
    }
    #loading {
      position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
      background: #0f1623; color: #9fb0cc; font-size: 13px; gap: 9px; transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(159,176,204,0.3); border-top-color: #9fb0cc; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .maplibregl-ctrl-attrib { font-size: 10px !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title" class="panel">
    <div class="eyebrow">EUBUCCO · 322M buildings</div>
    <div class="name">Every city across Europe</div>
    <div class="sub">circle size = building count · color = main data source · zoom in for detail</div>
  </div>
  <div id="legend" class="panel">
    <div class="row"><span class="dot" style="background:#7dd3a0"></span><span class="lbl">Government</span></div>
    <div class="row"><span class="dot" style="background:#5cb1c9"></span><span class="lbl">Microsoft</span></div>
    <div class="row"><span class="dot" style="background:#e8b54a"></span><span class="lbl">OpenStreetMap</span></div>
  </div>
  <div id="tip" class="tip"></div>
  <div id="loading"><span class="spinner"></span>Loading 96k cities…</div>

<script>
const DATA_URL = "{% static 'notebooks/getting-started/city-points.json' %}";
const MAP_STYLES = {
  dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
};
const SRC_COLOR = ['match', ['get', 's'], 0, '#7dd3a0', 1, '#5cb1c9', 2, '#e8b54a', '#888'];
const SRC_NAME = ['Government', 'Microsoft', 'OpenStreetMap'];

function storedTheme() {
  try {
    const q = new URLSearchParams(location.search).get('theme');
    if (q === 'light' || q === 'dark') return q;
    const t = localStorage.getItem('ui-theme');
    if (t === 'light' || t === 'dark') return t;
  } catch (e) {}
  return 'dark';
}
function applyHtmlTheme(m) { document.documentElement.classList.toggle('dark', m === 'dark'); }
applyHtmlTheme(storedTheme());
function styleUrl() { return storedTheme() === 'dark' ? MAP_STYLES.dark : MAP_STYLES.light; }

const map = new maplibregl.Map({
  container: 'map', style: styleUrl(),
  center: [9.5, 49.5], zoom: 3.4, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

let geojson = null;
fetch(DATA_URL).then(r => r.json()).then(data => {
  geojson = {
    type: 'FeatureCollection',
    features: data.pts.map(p => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [p[0], p[1]] },
      properties: { n: p[2], s: p[3] },
    })),
  };
  if (map.isStyleLoaded()) addLayer();
});

function addLayer() {
  if (!geojson || map.getSource('cities')) return;
  map.addSource('cities', { type: 'geojson', data: geojson });
  map.addLayer({
    id: 'cities', type: 'circle', source: 'cities',
    paint: {
      'circle-color': SRC_COLOR,
      'circle-opacity': 0.78,
      'circle-blur': 0.25,
      'circle-stroke-width': 0.4,
      'circle-stroke-color': 'rgba(0,0,0,0.25)',
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        3, ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 10, 0.8, 120, 2.5, 920, 11],
        7, ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 10, 2.5, 120, 9, 920, 36],
      ],
    },
  });
  document.getElementById('loading').classList.add('hidden');
}

map.on('style.load', addLayer);
map.on('load', () => setTimeout(() => document.getElementById('loading').classList.add('hidden'), 2500));
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 9000);
map.on('error', e => console.error('map error', e && e.error));

// Survive a lost WebGL context gracefully (no error cascade)
map.getCanvas().addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  const el = document.getElementById('loading');
  el.classList.remove('hidden');
  el.textContent = 'Map paused (graphics context lost) — reload the page to view.';
}, false);

// Hover tooltip
const tip = document.getElementById('tip');
map.on('mousemove', 'cities', (e) => {
  const f = e.features[0]; if (!f) return;
  map.getCanvas().style.cursor = 'pointer';
  tip.style.display = 'block';
  tip.style.left = e.point.x + 'px';
  tip.style.top = e.point.y + 'px';
  tip.innerHTML = '<b>' + f.properties.n.toLocaleString() + '</b> buildings · ' + SRC_NAME[f.properties.s];
});
map.on('mouseleave', 'cities', () => { tip.style.display = 'none'; map.getCanvas().style.cursor = ''; });

// Follow the site light/dark toggle
window.addEventListener('storage', (e) => {
  if (e.key !== 'ui-theme') return;
  applyHtmlTheme(storedTheme());
  map.setStyle(styleUrl());
});
</script>
</body>
</html>
