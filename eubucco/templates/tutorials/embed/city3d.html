{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EUBUCCO — Zürich in 3D</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    :root {
      --panel-bg: rgba(255,255,255,0.82); --panel-fg: #1f2328; --panel-line: rgba(0,0,0,0.10);
    }
    html.dark {
      --panel-bg: rgba(17,24,39,0.72); --panel-fg: #e6edf3; --panel-line: rgba(255,255,255,0.12);
    }
    html, body { margin: 0; height: 100%; background: #0f1623; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; }
    .overlay {
      position: absolute; z-index: 2; backdrop-filter: blur(8px);
      background: var(--panel-bg); color: var(--panel-fg);
      border: 1px solid var(--panel-line); border-radius: 12px;
    }
    #title {
      top: 12px; left: 12px; padding: 9px 13px; max-width: 60%;
    }
    #title .eyebrow { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; font-weight: 700; }
    #title .name { font-size: 15px; font-weight: 750; line-height: 1.2; margin-top: 1px; }
    #title .sub { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    #legend { bottom: 14px; left: 12px; padding: 9px 12px; }
    #legend .lbl { font-size: 10px; font-weight: 600; opacity: 0.75; margin-bottom: 6px; }
    #legend .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 10px; }
    #legend .row { display: flex; align-items: center; gap: 6px; opacity: 0.85; }
    #legend .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
    #loading {
      position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
      background: #0f1623; color: #9fb0cc; font-size: 13px; gap: 9px; transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(159,176,204,0.3); border-top-color: #9fb0cc;
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .maplibregl-ctrl-attrib { font-size: 10px !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="title" class="overlay">
    <div class="eyebrow">EUBUCCO · 3D building stock</div>
    <div class="name">Zürich, Switzerland</div>
    <div class="sub">Footprints extruded by height and colored by use type</div>
  </div>
  <div id="legend" class="overlay">
    <div class="lbl">Building use</div>
    <div class="rows">
      <div class="row"><span class="sw" style="background:#34d399"></span>Detached</div>
      <div class="row"><span class="sw" style="background:#fbbf24"></span>Commercial</div>
      <div class="row"><span class="sw" style="background:#86efac"></span>Semi-detached</div>
      <div class="row"><span class="sw" style="background:#f97316"></span>Industrial</div>
      <div class="row"><span class="sw" style="background:#6ee7b7"></span>Terraced</div>
      <div class="row"><span class="sw" style="background:#c084fc"></span>Public</div>
      <div class="row"><span class="sw" style="background:#60a5fa"></span>Apartment</div>
      <div class="row"><span class="sw" style="background:#a3e635"></span>Agricultural</div>
      <div class="row"><span class="sw" style="background:#9aa3b2"></span>Other</div>
    </div>
  </div>
  <div id="loading"><span class="spinner"></span>Loading 3D buildings…</div>

<script>
const PMTILES_URL = "{{ pmtiles_url }}";
const MAP_STYLES = {
  dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
};
// Colour by building use subtype (same palette as the explorer).
const SUBTYPE_COLOR = ['match', ['downcase', ['coalesce', ['get', 'subtype'], '']],
  'commercial', '#fbbf24',
  'industrial', '#f97316',
  'public', '#c084fc',
  'agricultural', '#a3e635',
  'apartment', '#60a5fa',
  'terraced', '#6ee7b7',
  'semi-detached', '#86efac',
  'detached', '#34d399',
  /* others / unknown */ '#9aa3b2'];

function storedTheme() {
  try {
    const q = new URLSearchParams(location.search).get('theme');
    if (q === 'light' || q === 'dark') return q;
    const t = localStorage.getItem('ui-theme');
    if (t === 'light' || t === 'dark') return t;
  } catch (e) {}
  return 'dark';
}
function applyHtmlTheme(mode) { document.documentElement.classList.toggle('dark', mode === 'dark'); }
applyHtmlTheme(storedTheme());

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const BASEMAP_BUILDING_LAYERS = new Set();
function styleUrl() { return storedTheme() === 'dark' ? MAP_STYLES.dark : MAP_STYLES.light; }

const _q = new URLSearchParams(location.search);
const map = new maplibregl.Map({
  container: 'map',
  style: styleUrl(),
  center: [8.5417, 47.3769],   // Zürich
  zoom: 15.2,
  pitch: 58,
  bearing: -20,
  antialias: true,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

function removeBasemapBuildings() {
  const style = map.getStyle();
  if (!style || !style.layers) return;
  for (const layer of [...style.layers]) {
    const sl = (layer['source-layer'] || '').toLowerCase();
    const id = (layer.id || '').toLowerCase();
    if ((sl === 'building' || sl === 'building_part' || (id.includes('building') && id !== 'buildings-3d')) && map.getLayer(layer.id)) {
      try { map.removeLayer(layer.id); } catch (e) {}
    }
  }
}

function addBuildings() {
  if (!map.getSource('eubucco')) {
    map.addSource('eubucco', {
      type: 'vector',
      url: `pmtiles://${PMTILES_URL}`,
      // Tiles are generated to z14. Pin maxzoom so MapLibre overzooms beyond
      // it (buildings stay visible when zoomed in) instead of requesting
      // higher-zoom tiles that may not be populated.
      maxzoom: 14,
    });
  }
  if (!map.getLayer('buildings-3d')) {
    map.addLayer({
      id: 'buildings-3d', type: 'fill-extrusion', source: 'eubucco', 'source-layer': 'buildings',
      paint: {
        'fill-extrusion-color': SUBTYPE_COLOR,
        'fill-extrusion-height': ['coalesce', ['get', 'height'], 5],
        'fill-extrusion-base': 0,
        'fill-extrusion-opacity': 0.9,
      },
    });
  }
}

function buildScene() { removeBasemapBuildings(); addBuildings(); }
map.on('style.load', buildScene);

// Hide the loading overlay once our buildings tiles are in (during the intro
// orbit the map isn't `idle`, so don't wait for that).
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  document.getElementById('loading').classList.add('hidden');
  if (new URLSearchParams(location.search).get('orbit') !== '0') {
    requestAnimationFrame(orbit);  // start the intro orbit after first paint
  }
}
map.on('sourcedata', (e) => {
  if (e.sourceId === 'eubucco' && map.getSource('eubucco') && map.isSourceLoaded('eubucco')) reveal();
});
map.on('load', () => setTimeout(reveal, 2000));  // fallback: basemap is up
setTimeout(reveal, 8000);  // safety: never leave the loading overlay up indefinitely
map.on('error', (e) => console.error('map error', e && e.error));

// ── Finite intro orbit — rotates briefly, then lets the map go idle so the
//    GPU rests (an endless render loop can trigger context loss). ──────────
let orbiting = true, idleTimer = null, orbitStart = null, dead = false;
const ORBIT_MS = 22000;
function pauseOrbit() {
  orbiting = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { orbiting = true; }, 4500);
}
['mousedown', 'touchstart', 'wheel', 'dragstart'].forEach((ev) => map.on(ev, pauseOrbit));
function orbit(ts) {
  if (dead) return;
  if (orbitStart === null) orbitStart = ts;
  if (ts - orbitStart > ORBIT_MS) return;  // stop -> map idles -> GPU rests
  if (orbiting && !document.hidden && map.isStyleLoaded()) {
    try { map.setBearing((map.getBearing() + 0.05) % 360); } catch (e) { return; }
  }
  requestAnimationFrame(orbit);
}

// ── Survive a lost WebGL context gracefully (no error cascade) ──────────────
map.getCanvas().addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  dead = true;
  const el = document.getElementById('loading');
  el.classList.remove('hidden');
  el.textContent = 'Map paused (graphics context lost) — reload the page to view.';
}, false);

// ── Follow the site's light/dark toggle (same-origin localStorage) ──
// Swap only the basemap, carrying our source + extrusion layer across with
// transformStyle so they are never torn down (which threw "no tile manager"
// and blanked the buildings).
function setTheme(m) {
  applyHtmlTheme(m);
  map.setStyle(m === 'dark' ? MAP_STYLES.dark : MAP_STYLES.light, {
    transformStyle: (prev, next) => {
      if (!prev) return next;
      const sources = { ...next.sources };
      if (prev.sources && prev.sources.eubucco) sources.eubucco = prev.sources.eubucco;
      const keep = (prev.layers || []).filter((l) => l.id === 'buildings-3d');
      return { ...next, sources, layers: [...(next.layers || []), ...keep] };
    },
  });
}
window.addEventListener('storage', (e) => {
  if (e.key !== 'ui-theme' || !e.newValue) return;
  setTheme(e.newValue === 'light' ? 'light' : 'dark');
});
</script>
</body>
</html>
