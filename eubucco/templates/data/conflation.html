{% extends "base.html" %}
{% load static %}

{% block footer %}{% endblock footer %}

{% block content %}
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/[email protected]/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/[email protected]/dist.min.js"></script>
<style>
  /* Scoped to the demo so the site chrome (navbar/footer) is unaffected. */
  body{overflow:hidden !important}
  #conflation-root *{box-sizing:border-box}
  /* Fill the viewport below the 64px sticky navbar; becomes the positioning
     context for the absolutely-positioned map / pipeline / panel below.
     Theme tokens are inherited by the map canvas, pipeline, panel, tooltip
     and MapLibre chrome so all demo UI follows the light/dark toggle. */
  #conflation-root{
    position:fixed; top:64px; left:0; right:0; bottom:0;
    --bg:hsl(var(--b1));
    --ink:hsl(var(--bc));
    --ink-dim:hsl(var(--bc) / 0.6);
    --rule:hsl(var(--bc) / 0.12);
    --accent:hsl(var(--p));
    --accent-soft:hsl(var(--p) / 0.18);
    --accent-ink:hsl(var(--pc));
    background:var(--bg); color:var(--ink);
    font-family:inherit;
  }
  #conflation-root.theme-dark{--bg:#0a0c0f}
  #map{position:absolute;inset:0;background:var(--bg)}
  .maplibregl-ctrl-attrib{background:hsl(var(--b1)/0.82)!important;color:var(--ink-dim)!important;font-size:10px}
  .maplibregl-ctrl-attrib a,.maplibregl-ctrl-attrib-inner{color:var(--ink-dim)!important}

  #pipeline{
    position:absolute; top:0; left:0; right:0;
    background:linear-gradient(to right, hsl(var(--b1)/0.92), hsl(var(--b1)/0.82) 60%, hsl(var(--p)/0.06));
    border-bottom:1px solid hsl(var(--bc)/0.1);
    padding:7px 24px 7px;
    z-index:6;
    backdrop-filter:blur(12px);
  }
  #pipeline .track{
    display:grid; grid-template-columns:repeat(var(--n,6),1fr); gap:0;
    position:relative; max-width:1500px; margin:0 auto;
  }
  #pipeline .node{
    display:flex; flex-direction:column; align-items:flex-start;
    padding:0 14px 0 0; position:relative; cursor:pointer;
    transition:opacity .2s ease;
  }
  #pipeline .node:not(.cur){opacity:.55}
  #pipeline .node:hover{opacity:1}
  #pipeline .node .top{
    display:flex;align-items:center;gap:10px;width:100%;
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:4px;
  }
  #pipeline .node.cur .top{ color:var(--accent) }
  #pipeline .node .dot{
    width:9px;height:9px;border-radius:50%;
    background:transparent;border:1.5px solid var(--rule);
    flex-shrink:0;transition:all .2s ease;
  }
  #pipeline .node.done .dot{ background:var(--ink-dim);border-color:var(--ink-dim) }
  #pipeline .node.cur .dot{ background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft) }
  #pipeline .node .line{ flex:1; height:1px; background:var(--rule); margin-left:2px }
  #pipeline .node.done .line{ background:var(--ink-dim) }
  #pipeline .node:last-child .line{ display:none }
  #pipeline .node .label{
    /* display/padding explicitly reset: the bare ".label" class otherwise
       inherits DaisyUI's form-label component (flex + 0.5rem padding), which
       mis-aligns the title and adds vertical gap before "Step N". */
    display:block; width:100%;
    font-family:inherit;
    font-size:13px; line-height:1.2; color:var(--ink); padding:0 14px 0 0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #pipeline .node:not(.cur) .label{ color:var(--ink-dim) }
  #pipeline .node .sub{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:9.5px; color:var(--ink-dim); letter-spacing:.1em;
    margin-top:2px; text-transform:uppercase;
  }

  #panel{
    position:absolute; top:86px; left:20px; width:380px;
    max-height:calc(100% - 116px);
    background:hsl(var(--b1)/0.95);
    border:1px solid hsl(var(--bc)/0.1); border-radius:1rem;
    padding:22px 24px 18px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.5);
    backdrop-filter:blur(12px);
    overflow:auto; z-index:5;
  }
  #panelHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:0 0 12px}
  #panel h1{font-family:inherit;font-weight:600;font-size:20px;line-height:1.2;margin:0;letter-spacing:-.01em}
  #panel p.body{font-size:13px;line-height:1.55;color:var(--ink-dim);margin:0 0 14px}
  #panel p.body b{color:var(--ink);font-weight:600}

  /* Collapse toggle — only shown on mobile */
  #panelToggle{display:none;background:transparent;border:none;padding:2px;margin-top:1px;color:var(--ink-dim);cursor:pointer;line-height:0;transition:transform .2s ease}
  #panelToggle:hover{color:var(--ink)}
  #panel.collapsed #panelToggle{transform:rotate(-90deg)}

  .legend{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px;padding:10px 12px;background:hsl(var(--bc)/0.04);border:1px solid var(--rule);border-radius:.5rem}
  .legend .row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-dim);font-family:"JetBrains Mono",ui-monospace,monospace}
  .legend .sw{width:14px;height:10px;border:1.5px solid transparent;border-radius:1px;flex-shrink:0}
  .legend .row b{color:var(--ink);font-weight:500;margin-right:auto}

  .toggles{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
  .toggles + .toggles{ border-top:1px dashed var(--rule); margin-top:10px; padding-top:10px }
  .toggles .lbl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .toggles .lbl .badge{display:inline-block;height:auto;line-height:1.4;background:transparent;font-size:8px;letter-spacing:.1em;color:var(--ink-dim);padding:1px 5px;border:1px solid var(--rule);border-radius:2px}
  .toggles .lbl .badge.on{color:var(--accent);border-color:var(--accent)}
  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button{
    background:transparent;border:1px solid var(--rule);color:var(--ink-dim);
    padding:6px 9px;border-radius:2px;cursor:pointer;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.05em;
    transition:all .15s ease;
  }
  .seg button:hover{color:var(--ink);border-color:hsl(var(--bc)/0.3)}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .seg.src button.on{background:#7dd3a0;border-color:#7dd3a0;color:#0d0f12}
  .seg.geom button.on{background:#b08fd6;border-color:#b08fd6;color:#0d0f12}
  .seg.mat button.on{background:#d6a85a;border-color:#d6a85a;color:#0d0f12}
  .seg.unit button.on{background:#5cb1c9;border-color:#5cb1c9;color:#0d0f12}

  #nav{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:10px}
  #nav .counter{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-dim);letter-spacing:.1em}
  #nav .btns{display:flex;gap:6px}
  #nav button{background:transparent;border:1px solid var(--rule);color:var(--ink);padding:7px 14px;border-radius:2px;cursor:pointer;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;transition:all .15s ease}
  #nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  #nav button:disabled{opacity:.3;cursor:not-allowed}

  /* ── Mobile: compact, collapsible panel ── */
  @media (max-width: 768px){
    #panel{
      top:72px; left:12px; right:12px; width:auto;
      max-height:calc(100% - 150px);
      padding:14px 16px 12px; border-radius:.75rem;
    }
    #panelHead{margin-bottom:10px}
    #panel h1{font-size:16px}
    #panel p.body{font-size:12px;line-height:1.5;margin:0 0 10px}
    #panelToggle{display:inline-flex}
    /* Color-by toggles are power-user controls — drop them on small screens,
       along with the body sentence that points at them. */
    #panel #toggles{display:none}
    #panel .ctrl-hint{display:none}
    /* Collapsed: keep only the title and the step nav (so the map stays usable
       while still steppable / swipeable). */
    #panel.collapsed #panel-body{display:none}
    #panel.collapsed #panelHead{margin-bottom:0}
    /* Arrow-key hint is irrelevant on touch. */
    .hint{display:none}

    /* Pipeline scrolls horizontally; the active step is scrolled to center
       (see scrollActivePipelineNode) so later steps stay reachable. Inactive
       steps keep a fixed width (label truncated); the active step grows to fit
       its full label so it's never cropped. */
    #pipeline{overflow-x:auto; overflow-y:hidden; padding:7px 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
    #pipeline::-webkit-scrollbar{display:none}
    #pipeline .track{display:flex; max-width:none; margin:0}
    #pipeline .node{flex:0 0 124px}
    /* Active step grows only when its label needs more than the fixed width;
       short labels keep 124px so spacing to neighbours stays even. */
    #pipeline .node.cur{flex:0 0 auto; min-width:124px}
    #pipeline .node.cur .label{overflow:visible; text-overflow:clip}
  }

  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10;color:var(--ink-dim);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  #loading.hidden{display:none}

  .hint{position:absolute;bottom:14px;right:14px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;color:var(--ink-dim);letter-spacing:.12em;opacity:.7;z-index:4}
  .hint kbd{background:hsl(var(--bc)/0.08);border:1px solid var(--rule);padding:1px 5px;border-radius:2px;font-family:inherit}

  #tip{
    position:absolute; pointer-events:none; z-index:9;
    background:hsl(var(--b1)/0.96); border:1px solid var(--rule);
    border-radius:.5rem; padding:10px 12px;
    backdrop-filter:blur(8px);
    font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px;
    color:var(--ink); max-width:290px;
    box-shadow:0 12px 28px -10px rgba(0,0,0,.6);
    display:none;
  }
  #tip .tid{font-size:10px;color:var(--ink-dim);letter-spacing:.08em;margin-bottom:6px;word-break:break-all}
  #tip table{border-collapse:collapse;font-size:11px;width:100%}
  #tip td{padding:2px 6px 2px 0;vertical-align:top}
  #tip td.k{color:var(--ink-dim);text-transform:uppercase;font-size:9.5px;letter-spacing:.08em;white-space:nowrap}
  #tip td.v{color:var(--ink)}
  #tip td.s{color:var(--ink-dim);font-size:9.5px;text-align:right}
  #tip .pill{display:inline-block;padding:1px 5px;border-radius:2px;font-size:9px;letter-spacing:.08em;color:#0d0f12;font-weight:600;text-transform:uppercase}
  #tip .na{color:#6a7180;font-style:italic}
</style>

<div id="conflation-root">
  <div id="map"></div>
  <div id="loading">Loading tiles…</div>
  <div id="tip"></div>

  <header id="pipeline"><div class="track" id="pipelineTrack"></div></header>

  <aside id="panel">
    <div id="panelHead">
      <h1 id="title"></h1>
      <button id="panelToggle" type="button" aria-label="Collapse panel" aria-expanded="true">
        <svg style="width:16px;height:16px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.06l3.71-3.83a.75.75 0 1 1 1.08 1.04l-4.25 4.39a.75.75 0 0 1-1.08 0L5.21 8.27a.75.75 0 0 1 .02-1.06z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
    <div id="panel-body">
      <p class="body" id="body"></p>
      <div id="toggles"></div>
      <div id="legend"></div>
    </div>
    <div id="nav">
      <div class="counter" id="counter"></div>
      <div class="btns">
        <button id="back">← Back</button>
        <button id="next">Next →</button>
      </div>
    </div>
  </aside>

  <div class="hint"><kbd>←</kbd> <kbd>→</kbd> arrow keys</div>
</div><!-- /#conflation-root -->

  <!-- ============================================================
       CONFIG
       Data is the static sample-erfurt GeoJSON set, served by Django from
       eubucco/static/conflation/sample-erfurt/ and resolved through the
       {% templatetag openblock %} static {% templatetag closeblock %} tag
       (so it picks up hashed filenames under ManifestStaticFilesStorage in
       production). To update the demo, replace the files in that directory.
       enableMaterials adds step 7 (material intensities).
       ============================================================ -->
  <script>
  window.CONFIG = {
    dataMode: 'remote',
    enableMaterials: true,

    remote: {
      gov:       "{% static 'conflation/sample-erfurt/gov.geojson' %}",
      osm:       "{% static 'conflation/sample-erfurt/osm.geojson' %}",
      msft:      "{% static 'conflation/sample-erfurt/msft.geojson' %}",
      links:     "{% static 'conflation/sample-erfurt/links.geojson' %}",
      merged:    "{% static 'conflation/sample-erfurt/merged.geojson' %}",
      materials: "{% static 'conflation/sample-erfurt/materials.json' %}",
      meta:      "{% static 'conflation/sample-erfurt/meta.json' %}"
    }
  };
  </script>

  <script>
window.DATA={};
</script>

  <script>
  // ============================================================
  // CONSTANTS
  // ============================================================
  const COLORS = {
    gov:[78,161,255], osm:[125,211,160], msft:[224,122,122],
    estimated:[176,143,214], link:[232,181,74], unknown:[140,140,150]
  };
  const SRC_LABELS = {
    gov:'Governmental', osm:'OpenStreetMap', msft:'Microsoft ML',
    estimated:'Estimated (ML)', unknown:'Missing'
  };
  const SRC_LABELS_SHORT = {
    gov:'Gov', osm:'OSM', msft:'Microsoft', estimated:'Estimated', unknown:'—'
  };
  const REAL_SOURCES = new Set(['gov','osm','msft']);
  const rgba = (c,a) => [c[0],c[1],c[2],Math.round(a*255)];

  const TYPE_COLORS = { 'residential':[120,180,255], 'non-residential':[230,150,90] };
  const SUBTYPE_COLORS = {
    'industrial':[200,120,120],'commercial':[230,180,90],'public':[120,200,200],
    'detached':[120,180,255],'semi-detached':[150,160,230],'apartment':[90,140,220],
    'agricultural':[180,200,110],'others':[160,160,170]
  };
  const FLOOR_RANGES = [
    {min:1,   max:1.5, color:[214,196,140], label:'1 floor'},
    {min:1.5, max:2.5, color:[191,166,134], label:'2 floors'},
    {min:2.5, max:Infinity, color:[166,137,125], label:'3+ floors'},
  ];

  const HEIGHT_RANGES = [
    {min:0,  max:5,  color:[140,170,190], label:'low · 0–5 m'},
    {min:5,  max:10, color:[156,154,176], label:'mid · 5–10 m'},
    {min:10, max:15, color:[176,140,156], label:'tall · 10–15 m'},
    {min:15, max:Infinity, color:[191,128,128], label:'very tall · ≥15 m'},
  ];
  function rangeColor(ranges, v){ for(const r of ranges) if(v>=r.min && v<r.max) return r.color; return [80,80,90]; }
  function floorColor(v){ return rangeColor(FLOOR_RANGES, v); }
  function heightColor(v){ return rangeColor(HEIGHT_RANGES, v); }

  // Materials
  const MATERIALS = ['Concrete','Brick','Steel','Wood','Glass','Aluminum','Copper','Plastics'];
  const MATERIAL_COLORS = {
    'Concrete':[160,160,170], 'Brick':[200,110,90], 'Steel':[120,140,170],
    'Wood':[180,140,90], 'Glass':[140,210,220], 'Aluminum':[200,200,210],
    'Copper':[210,140,90], 'Plastics':[200,180,130]
  };
  // Per-material color scales (sequential, perceptually-spaced enough for legends)
  const MATERIAL_SCALE = {
    'Concrete':[[40,50,60],[160,160,170],[230,230,240]],
    'Brick':[[40,20,15],[180,90,70],[240,180,150]],
    'Steel':[[20,30,50],[110,130,170],[210,220,240]],
    'Wood':[[40,30,15],[170,130,80],[240,210,160]],
    'Glass':[[10,40,50],[100,180,200],[210,240,245]],
    'Aluminum':[[40,40,50],[170,170,180],[240,240,245]],
    'Copper':[[40,20,10],[200,130,80],[245,200,150]],
    'Plastics':[[40,35,20],[180,160,110],[245,235,200]],
  };

  // ============================================================
  // STATE  (sticky across steps where it makes sense)
  // ============================================================
  let activeStep = 0;
  let colorMode  = 'geom_source';   // 'geom_source' | 'attribute' | 'source'
  let activeAttr = 'type';
  let activeMaterial = 'Glass';
  let materialUnit  = 'MI';         // 'MI' (kg/m²) | 'kg' (total mass)

  let map, deckOverlay;
  let animFrame = 0, animStart = 0, animDuration = 0;
  let animFrom = null, animTo = null;

  // ============================================================
  // ATTRIBUTE-AVAILABILITY POLICY
  // ============================================================
  // The merged dataset is treated as authoritative: each attribute has a
  // *_source column on the building telling us where it came from. Per-step
  // visibility:
  //   Step 4 ('own'):  available if *_source equals the building's own
  //                    geometry_source (i.e. the building's own primary
  //                    source dataset provided this attribute).
  //   Step 5 ('real'): available if *_source is one of gov/osm/msft
  //                    (any real source, but not 'estimated').
  //   Step 6 ('all'):  always available.
  // We do NOT recompute heights or attributes from sibling links here —
  // the merged file's columns are authoritative.
  function attrAvailable(f, attrKey){
    const step = STEPS[activeStep];
    if(step.materialMode) return true;
    const p = f.properties;
    const stage = step.attrStage || 'all';     // 'own' | 'real' | 'all'
    if(stage === 'all') return true;
    const srcKey = attrKey + '_source';
    const src = p[srcKey];
    if(stage === 'own')  return src === p.geometry_source;
    if(stage === 'real') return REAL_SOURCES.has(src);
    return false;
  }
  function attrValue(f, attrKey){
    if(!attrAvailable(f, attrKey)) return null;
    return f.properties[attrKey] ?? null;
  }
  function attrProvider(f, attrKey){
    if(!attrAvailable(f, attrKey)) return null;
    return f.properties[attrKey + '_source'] ?? null;
  }

  // ============================================================
  // COLOR RESOLUTION (merged dataset)
  // ============================================================
  function attrColor(f){
    if(!attrAvailable(f, activeAttr)) return [80,80,90];
    const v = attrValue(f, activeAttr);
    if(activeAttr === 'type')    return TYPE_COLORS[v] || COLORS.unknown;
    if(activeAttr === 'subtype') return SUBTYPE_COLORS[v] || COLORS.unknown;
    if(activeAttr === 'floors')  return v==null ? [80,80,90] : floorColor(v);
    if(activeAttr === 'height')  return v==null ? [80,80,90] : heightColor(v);
    return COLORS.unknown;
  }
  function sourceColor(f){
    const src = attrProvider(f, activeAttr);
    return src ? (COLORS[src] || [80,80,90]) : [80,80,90];
  }
  function colorFor(f){
    if(colorMode === 'geom_source') return COLORS[f.properties.geometry_source] || COLORS.unknown;
    if(colorMode === 'source')      return sourceColor(f);
    return attrColor(f);
  }

  // ============================================================
  // MATERIAL HELPERS  (step 7)
  // ============================================================
  function materialValue(f){
    const m = DATA.materials && DATA.materials[f.properties.id];
    if(!m) return null;
    const key = activeMaterial + '_' + materialUnit + '50';
    const v = m[key];
    return v == null ? null : v;
  }
  function materialMaxFor(material, unit){
    if(!DATA.materials) return 1;
    const key = material + '_' + unit + '50';
    let mx = 0;
    for(const id in DATA.materials){
      const v = DATA.materials[id][key];
      if(v != null && v > mx) mx = v;
    }
    return mx || 1;
  }
  function interpColor(stops, t){
    t = Math.max(0, Math.min(1, t));
    const idx = t * (stops.length - 1);
    const i = Math.floor(idx), frac = idx - i;
    const a = stops[i], b = stops[Math.min(stops.length-1, i+1)];
    return [
      Math.round(a[0] + (b[0]-a[0])*frac),
      Math.round(a[1] + (b[1]-a[1])*frac),
      Math.round(a[2] + (b[2]-a[2])*frac),
    ];
  }
  function materialColor(f){
    const v = materialValue(f);
    if(v == null) return [60,60,70];
    const max = materialMaxFor(activeMaterial, materialUnit);
    const t = Math.sqrt(Math.min(1, v / max));  // sqrt to spread out lower values
    return interpColor(MATERIAL_SCALE[activeMaterial], t);
  }

  // ============================================================
  // HEIGHT ACCESSOR
  // ============================================================
  // The merged dataset has a single `height` column. Whether it's rendered
  // (and animates from 0 / stays at 0) is decided by the current step's
  // attrStage via attrAvailable(f, 'height').
  //
  // For transition animations, `animFrom` and `animTo` are functions:
  //   f => height-at-step. The interpolation is per-feature.
  function getHeight(f){
    const to_h   = (typeof animTo   === 'function') ? animTo(f)   : 0;
    if(animDuration <= 0) return to_h;
    const from_h = (typeof animFrom === 'function') ? animFrom(f) : 0;
    if(from_h === to_h) return to_h;
    const t = Math.min(1, (performance.now() - animStart) / animDuration);
    if(t < 0) return from_h;
    const e = 1 - Math.pow(1-t, 3);
    return from_h + (to_h - from_h) * e;
  }
  // Effective rendered height at the current step (used by both static
  // rendering and the animation start/end points).
  // Effective height a building should show under a given attrStage.
  // Stages 'own' / 'real' / 'all' use the visibility policy from attrAvailable.
  // null stage (steps 1-3 which don't render the merged layer) → 0 for all.
  function effectiveHeightAtStage(f, stage){
    if(!stage) return 0;
    if(stage === 'all') return f.properties.height || 0;
    const p = f.properties;
    const src = p.height_source;
    if(stage === 'own')  return (src === p.geometry_source) ? (p.height || 0) : 0;
    if(stage === 'real') return REAL_SOURCES.has(src) ? (p.height || 0) : 0;
    return 0;
  }
  // Steps 1-3 don't render the merged layer at all → no heights.
  // The material step inherits the prior step's "all heights visible".
  function heightStageFor(step){
    if(!step) return null;
    if(step.materialMode) return 'all';   // materials keep all heights
    if(step.attrStage === 'own' || step.attrStage === 'real' || step.attrStage === 'all'){
      // Only steps with showToggles render the merged extrusion. Steps 1-3
      // have showToggles undefined.
      return step.showToggles ? step.attrStage : null;
    }
    return null;
  }
  function effectiveHeight(f){
    return effectiveHeightAtStage(f, heightStageFor(STEPS[activeStep]));
  }

  // ============================================================
  // LAYER FACTORIES
  // ============================================================
  function sourceLayers(keys, opts){
    return keys.map(k => new deck.GeoJsonLayer({
      id:k, data:DATA[k],
      filled:true, stroked:true, extruded:false, pickable:true,
      getFillColor: rgba(COLORS[k], opts.fill),
      getLineColor: rgba(COLORS[k], opts.line),
      lineWidthMinPixels:1.2,
      onHover: info => showTip(info, k)
    }));
  }

  function mergedDynamicLayer(opts = {}) {
    // Fall back to original values if opts aren't explicitly passed
    const fillAlpha = opts.fill !== undefined ? Math.round(opts.fill * 255) : 235;
    const lineAlpha = opts.line !== undefined ? Math.round(opts.line * 255) : 255;

    // Detect if we should render 3D or 2D based on the current step's settings
    const currentStepObj = STEPS[activeStep];
    const is3D = currentStepObj && currentStepObj.view && currentStepObj.view.pitch > 0;

    return new deck.GeoJsonLayer({
      id: 'merged', 
      data: DATA.merged,
      pickable: true,
      
      // Dynamic rendering style based on 2D vs 3D views
      extruded: is3D, 
      filled: true, 
      stroked: !is3D, // Turn strokes back on for 2D steps so borders are visible!
      
      getElevation: getHeight,
      
      getFillColor: f => {
        const c = colorFor(f);
        // If 3D, deck.gl forces 255 alpha anyway. If 2D, apply your preferred fillAlpha.
        return [c[0], c[1], c[2], is3D ? 235 : fillAlpha];
      },
      
      getLineColor: f => {
        const c = colorFor(f);
        return [
          Math.min(255, c[0] + 20), 
          Math.min(255, c[1] + 20), 
          Math.min(255, c[2] + 20), 
          lineAlpha
        ];
      },
      
      lineWidthMinPixels: is3D ? 0.5 : 1.2, // Match sourceLayers thickness in 2D mode
      material: { ambient: 0.55, diffuse: 0.7, shininess: 6, specularColor: [40, 40, 40] },
      onHover: info => showTip(info, 'merged'),
      
      updateTriggers: {
        // Crucial: tell deck.gl to redraw when transitioning between steps
        extruded: [activeStep],
        stroked: [activeStep],
        getFillColor: [colorMode, activeAttr, activeStep, fillAlpha],
        getLineColor: [colorMode, activeAttr, activeStep, lineAlpha],
        getElevation: [animFrame]
      }
    });
  }

  function materialBuildingLayer(){
    return new deck.GeoJsonLayer({
      id:'merged-mat', data:DATA.merged,
      filled:true, stroked:true, extruded:true, pickable:true,
      getElevation: getHeight,
      getFillColor: f => {
        const c = materialColor(f);
        const has = materialValue(f) != null;
        return [c[0],c[1],c[2], has ? 235 : 90];
      },
      getLineColor: f => {
        const c = materialColor(f);
        return [Math.min(255,c[0]+20), Math.min(255,c[1]+20), Math.min(255,c[2]+20), 255];
      },
      lineWidthMinPixels:0.5,
      material:{ ambient:0.55, diffuse:0.7, shininess:6, specularColor:[40,40,40] },
      onHover: info => showTip(info, 'material'),
      updateTriggers:{
        getFillColor:[activeMaterial, materialUnit],
        getLineColor:[activeMaterial, materialUnit],
        getElevation:[animFrame]
      }
    });
  }

  // ============================================================
  // TOOLTIP
  // ============================================================
  function fmtVal(v){
    if(v==null || v==='' || v==='nan') return null;
    if(typeof v === 'number'){
      const a = Math.abs(v);
      if(a >= 1000)  return v.toFixed(0);
      if(a >= 10)    return v.toFixed(1);
      return v.toFixed(2);
    }
    return String(v);
  }
  function srcPill(src){
    if(!src) return '';
    const c = COLORS[src] || COLORS.unknown;
    return `<span class="pill" style="background:rgb(${c[0]},${c[1]},${c[2]})">${SRC_LABELS_SHORT[src]||src}</span>`;
  }
  function showTip(info, layerKey){
    const tip = document.getElementById('tip');
    if(!info.object){ tip.style.display='none'; return; }
    const p = info.object.properties;
    let rows = '';

    if(layerKey === 'material'){
      const mat = DATA.materials && DATA.materials[p.id];
      rows = `<tr><td class="k">Geometry</td><td class="v" colspan="2">${srcPill(p.geometry_source)}</td></tr>`;
      rows += `<tr><td class="k">Height</td><td class="v">${fmtVal(p.height)} m</td><td class="s"></td></tr>`;
      rows += `<tr><td class="k">Floors</td><td class="v">${fmtVal(p.floors)}</td><td class="s"></td></tr>`;
      if(mat){
        rows += `<tr><td colspan="3" style="padding-top:6px;border-top:1px solid hsl(var(--bc)/0.12)"></td></tr>`;
        for(const m of MATERIALS){
          const mi = mat[m+'_MI50'], kg = mat[m+'_kg50'];
          const hl = (m === activeMaterial) ? ' style="color:var(--accent)"' : '';
          rows += `<tr${hl}><td class="k">${m}</td><td class="v">${fmtVal(mi)} kg/m²</td><td class="s">${fmtVal(kg)} kg</td></tr>`;
        }
      } else {
        rows += `<tr><td colspan="3" class="na">No material estimate</td></tr>`;
      }
    } else if(layerKey === 'merged'){
      const attrs = [
        ['Type',   'type',    p.type,                        p.type_source],
        ['Subtype','subtype', p.subtype,                     p.subtype_source],
        ['Floors', 'floors',  p.floors,                      p.floors_source],
        ['Height', 'height',  p.height!=null ? p.height.toFixed(2)+' m' : null, p.height_source],
        ['Year',   'construction_year', p.construction_year, p.construction_year_source],
      ];
      const fake = { properties: p };
      rows = `<tr><td class="k">Geometry</td><td class="v" colspan="2">${srcPill(p.geometry_source)}</td></tr>`;
      for(const [label, key, v, s] of attrs){
        const available = attrAvailable(fake, key);
        // Show "—" for attributes that aren't available at this stage or have no value
        const valOut = (available && v != null) ? fmtVal(v) : '<span class="na">—</span>';
        const pillOut = (available && s) ? srcPill(s) : '';
        rows += `<tr><td class="k">${label}</td>` +
                `<td class="v">${valOut}</td>` +
                `<td class="s">${pillOut}</td></tr>`;
      }
    } else {
      // raw source layers
      const attrs = [
        ['Height', p.height!=null ? p.height.toFixed(2)+' m' : null],
        ['Floors', p.floors],
        ['Type',   p.type],
      ];
      rows = `<tr><td class="k">Dataset</td><td class="v" colspan="2">${srcPill(layerKey)}</td></tr>`;
      for(const [k,v] of attrs){
        const valOut = (v == null || v === '' || v === 'nan') ? '<span class="na">—</span>' : fmtVal(v);
        rows += `<tr><td class="k">${k}</td><td class="v" colspan="2">${valOut}</td></tr>`;
      }
    }
    tip.innerHTML = `<div class="tid">${p.id || ''}</div><table>${rows}</table>`;
    tip.style.display = 'block';
    tip.style.left = (info.x + 14) + 'px';
    tip.style.top  = (info.y + 14) + 'px';
  }

  // ============================================================
  // MAP
  // ============================================================
  const BASE_STYLES = {
    dark:  'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
  };
  let currentBaseTheme = null;
  let themeObserver = null;

  function isDarkTheme() {
    return !!(document.documentElement.classList.contains('dark') ||
              document.querySelector('[data-theme="night"]'));
  }

  function applyThemeClass(){
    const root = document.getElementById('conflation-root');
    if(!root) return;
    const dark = isDarkTheme();
    root.classList.toggle('theme-dark', dark);
    root.classList.toggle('theme-light', !dark);
  }

  function makeBaseStyle(){
    return isDarkTheme() ? BASE_STYLES.dark : BASE_STYLES.light;
  }

  // Mobile shows less detail per step — pull the camera back by 1 zoom levels.
  function zoomOffset(){
    return window.matchMedia('(max-width: 768px)').matches ? 1 : 0;
  }

  function syncBaseStyle(){
    applyThemeClass();
    if(!map) return;
    const nextBaseTheme = isDarkTheme() ? 'dark' : 'light';
    if(nextBaseTheme === currentBaseTheme) return;
    currentBaseTheme = nextBaseTheme;
    map.setStyle(makeBaseStyle(), { diff: false });
    // Strip the new basemap's building layers on style.load — i.e. before they
    // ever paint — so they never flash in. requestAnimationFrame catches any
    // that settle a frame later; the persistent idle handler is the backstop.
    map.once('style.load', () => {
      removeBasemapBuildings();
      requestAnimationFrame(removeBasemapBuildings);
    });
  }

  function watchThemeChanges(){
    if(themeObserver) return;
    themeObserver = new MutationObserver(syncBaseStyle);
    themeObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class', 'data-theme'],
      subtree: true
    });
  }

  function removeBasemapBuildings(){
    // Drop the CARTO basemap's own building footprint/extrusion layers. Our own
    // buildings are a separate deck.gl overlay, so this only touches the basemap.
    try {
      const style = map.getStyle();
      if(!style || !style.layers) return;
      for(const layer of [...style.layers]){
        const sourceLayer = (layer['source-layer'] || '').toLowerCase();
        const id = (layer.id || '').toLowerCase();
        if(sourceLayer === 'building' || sourceLayer === 'building_part' || id.includes('building')){
          if(map.getLayer(layer.id)) map.removeLayer(layer.id);
        }
      }
    } catch(e){
      console.warn('Could not strip basemap buildings:', e);
    }
  }

  async function init(){
    await loadRemoteData();
    startMap();
  }
  function startMap(){
    if(!window.DATA){
      document.getElementById('loading').textContent = 'No data loaded';
      return;
    }
    applyThemeClass();
    currentBaseTheme = isDarkTheme() ? 'dark' : 'light';
    map = new maplibregl.Map({
      container:'map',
      style: makeBaseStyle(),
      center: DATA.meta.center, zoom:16.2 - zoomOffset(), pitch:0, bearing:0,
      attributionControl:{compact:true}
    });
    map.on('style.load', () => {
      removeBasemapBuildings();
      requestAnimationFrame(removeBasemapBuildings);
    });
    map.on('idle', removeBasemapBuildings);
    watchThemeChanges();
    map.on('load', () => {
      document.getElementById('loading').classList.add('hidden');
      removeBasemapBuildings();
      deckOverlay = new deck.MapboxOverlay({ interleaved:false, layers:[] });
      map.addControl(deckOverlay);
      buildPipeline();
      goto(0, false);
    });
    map.getCanvas().addEventListener('mouseleave', () => {
      document.getElementById('tip').style.display='none';
    });
  }

  async function loadRemoteData(){
    const cfg = window.CONFIG.remote;
    document.getElementById('loading').textContent = 'Fetching data…';
    const j = async u => (await fetch(u)).json();
    try {
      const tasks = [
        j(cfg.gov), j(cfg.osm), j(cfg.msft),
        j(cfg.links), j(cfg.merged), j(cfg.meta).catch(()=>({center:[0,0]}))
      ];
      if(window.CONFIG.enableMaterials && cfg.materials) tasks.push(j(cfg.materials).catch(()=>null));
      const [gov,osm,msft,links,merged,meta,materials] = await Promise.all(tasks);
      window.DATA = { gov, osm, msft, links, merged, meta, materials: materials || null };
    } catch(e){
      console.error('Remote load failed', e);
      document.getElementById('loading').textContent = 'Load failed — see console';
    }
  }

  // ============================================================
  // PIPELINE
  // ============================================================
  function buildPipeline(){
    const t = document.getElementById('pipelineTrack');
    t.style.setProperty('--n', STEPS.length);
    t.innerHTML = STEPS.map((s,i)=>`
      <div class="node" data-i="${i}">
        <div class="top"><span class="dot"></span><span class="line"></span></div>
        <div class="label">${s.shortLabel}</div>
        <div class="sub">Step ${i+1}</div>
      </div>`).join('');
    t.querySelectorAll('.node').forEach(n => {
      n.addEventListener('click', () => goto(+n.dataset.i, true));
    });
  }
  function renderPipeline(){
    document.querySelectorAll('#pipelineTrack .node').forEach((n,i)=>{
      n.classList.toggle('cur', i===activeStep);
      n.classList.toggle('done', i<activeStep);
    });
    scrollActivePipelineNode();
  }
  // On mobile the pipeline scrolls horizontally; keep the active step centered
  // so steps on either side stay reachable.
  function scrollActivePipelineNode(){
    const pipeline = document.getElementById('pipeline');
    const cur = document.querySelector('#pipelineTrack .node.cur');
    if(!pipeline || !cur || pipeline.scrollWidth <= pipeline.clientWidth) return;
    const pRect = pipeline.getBoundingClientRect();
    const cRect = cur.getBoundingClientRect();
    const delta = (cRect.left + cRect.width / 2) - (pRect.left + pRect.width / 2);
    pipeline.scrollTo({ left: pipeline.scrollLeft + delta, behavior: 'smooth' });
  }

  // ============================================================
  // PANEL
  // ============================================================
  function legendItems(){
    const s = STEPS[activeStep];
    if(s.materialMode){
      const max = materialMaxFor(activeMaterial, materialUnit);
      const stops = MATERIAL_SCALE[activeMaterial];
      const unit = materialUnit==='MI' ? 'kg/m²' : 'kg';
      return [
        {col:`rgb(${stops[0].join(',')})`, label:`low · ~${fmtVal(max*0.05)} ${unit}`},
        {col:`rgb(${stops[1].join(',')})`, label:`mid · ~${fmtVal(max*0.5)} ${unit}`},
        {col:`rgb(${stops[2].join(',')})`, label:`high · ~${fmtVal(max)} ${unit}`},
        {col:'rgb(60,60,70)',              label:'No estimate'},
      ];
    }
    if(colorMode==='geom_source'){
      return [
        {col:`rgb(${COLORS.gov.join(',')})`,  label:'Geometry from ' + SRC_LABELS.gov},
        {col:`rgb(${COLORS.osm.join(',')})`,  label:'Geometry from ' + SRC_LABELS.osm},
        {col:`rgb(${COLORS.msft.join(',')})`, label:'Geometry from ' + SRC_LABELS.msft},
      ];
    }
    if(colorMode==='source'){
      return [
        {col:`rgb(${COLORS.gov.join(',')})`,       label:SRC_LABELS.gov},
        {col:`rgb(${COLORS.osm.join(',')})`,       label:SRC_LABELS.osm},
        {col:`rgb(${COLORS.msft.join(',')})`,      label:SRC_LABELS.msft},
        {col:`rgb(${COLORS.estimated.join(',')})`, label:SRC_LABELS.estimated},
        {col:'rgb(80,80,90)',                      label:SRC_LABELS.unknown},
      ];
    }
    if(activeAttr==='type'){
      return [
        {col:`rgb(${TYPE_COLORS['residential'].join(',')})`,     label:'Residential'},
        {col:`rgb(${TYPE_COLORS['non-residential'].join(',')})`, label:'Non-residential'},
        {col:'rgb(80,80,90)', label:'Unknown / Missing'},
      ];
    }
    if(activeAttr==='subtype'){
      return Object.entries(SUBTYPE_COLORS).map(([k,c])=>({
        col:`rgb(${c.join(',')})`,
        label: k.charAt(0).toUpperCase() + k.slice(1)
      })).concat([{col:'rgb(80,80,90)', label:'Unknown / Missing'}]);
    }
    if(activeAttr==='floors'){
      return FLOOR_RANGES.map(r => ({col:`rgb(${r.color.join(',')})`, label:r.label}))
        .concat([{col:'rgb(80,80,90)', label:'Unknown / Missing'}]);
    }
    if(activeAttr==='height'){
      return HEIGHT_RANGES.map(r => ({col:`rgb(${r.color.join(',')})`, label:r.label}))
        .concat([{col:'rgb(80,80,90)', label:'Unknown / Missing'}]);
    }
    return [];
  }

  function renderPanel(){
    const s = STEPS[activeStep];
    document.getElementById('title').textContent = s.title;
    document.getElementById('body').innerHTML = s.body;
    document.getElementById('counter').textContent = `${activeStep+1} / ${STEPS.length}`;
    document.getElementById('back').disabled = activeStep===0;
    document.getElementById('next').disabled = activeStep===STEPS.length-1;

    let legHtml = '';
    if(s.showToggles || (s.legend && s.legend.length)){
      const items = (s.legend && s.legend.length) ? s.legend.map(([k,label]) => ({
        col: k==='link' ? `rgb(${COLORS[k].join(',')})` : `rgb(${COLORS[k].join(',')})33`,
        label, k
      })) : legendItems();
      legHtml = '<div class="legend">' + items.map(it => {
        if(it.k === 'link'){
          return `<div class="row"><span class="sw" style="background:${it.col.replace(/33$/,'')};border-color:${it.col.replace(/33$/,'')};height:2px;align-self:center"></span><b>${it.label}</b></div>`;
        }
        return `<div class="row"><span class="sw" style="background:${it.col};border-color:${it.col.replace(/33$/,'')}"></span><b>${it.label}</b></div>`;

    }

    const tEl = document.getElementById('toggles');
    if(s.materialMode){
      const mats = MATERIALS;
      tEl.innerHTML = `
        <div class="toggles">
          <div class="lbl">Material <span class="badge on">${activeMaterial}</span></div>
          <div class="seg mat" data-mode="material">
            ${mats.map(m => `<button data-m="${m}" class="${activeMaterial===m?'on':''}">${m}</button>`).join('')}
          </div>
        </div>
        <div class="toggles">
          <div class="lbl">Unit <span class="badge on">${materialUnit==='MI'?'kg/m²':'kg'}</span></div>
          <div class="seg unit" data-mode="unit">
            <button data-u="MI" class="${materialUnit==='MI'?'on':''}">Intensity (kg/m²)</button>
            <button data-u="kg" class="${materialUnit==='kg'?'on':''}">Mass (kg)</button>
          </div>
        </div>
      `;
      tEl.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          if(b.dataset.m){ activeMaterial = b.dataset.m; }
          if(b.dataset.u){ materialUnit  = b.dataset.u; }
          renderPanel(); renderLayers();
        });
      });
    } else if(s.showToggles){
      const opts = [['type','Type'],['subtype','Subtype'],['floors','Floors'],['height','Height']];
      const showGeomSource = s.defaultColorMode === 'geom_source';
      tEl.innerHTML = `
        ${showGeomSource ? `
        <div class="toggles">
          <div class="lbl">Color by geometry source <span class="badge ${colorMode==='geom_source'?'on':''}">provider</span></div>
          <div class="seg geom" data-mode="geom_source">
            <button data-k="geom" class="${colorMode==='geom_source'?'on':''}">Geometry source</button>
          </div>
        </div>` : ''}
        <div class="toggles">
          <div class="lbl">Color by attribute <span class="badge ${colorMode==='attribute'?'on':''}">value</span></div>
          <div class="seg" data-mode="attribute">
            ${opts.map(([k,l])=>`<button data-k="${k}" class="${activeAttr===k && colorMode==='attribute'?'on':''}">${l}</button>`).join('')}
          </div>
        </div>
        ${s.attrStage === 'own' ? '' : `
        <div class="toggles">
          <div class="lbl">Color by attribute source <span class="badge ${colorMode==='source'?'on':''}">provider</span></div>
          <div class="seg src" data-mode="source">
            ${opts.map(([k,l])=>`<button data-k="${k}" class="${activeAttr===k && colorMode==='source'?'on':''}">${l}</button>`).join('')}
          </div>
        </div>`}`;
      tEl.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          const newMode = b.parentElement.dataset.mode;
          colorMode = newMode;
          if(newMode !== 'geom_source') activeAttr = b.dataset.k;
          renderPanel(); renderLayers();
        });
      });
    } else {
      tEl.innerHTML = '';
    }
  }

  // ============================================================
  // RENDER + ANIMATION
  // ============================================================
  function renderLayers(){
    deckOverlay.setProps({ layers: STEPS[activeStep].build() });
  }
  function animLoop(){
    if(animDuration > 0){
      animFrame++;
      renderLayers();
      const t = performance.now() - animStart;
      if(t >= animDuration){
        animDuration = 0;
        animFrom = animTo;
        renderLayers();
        return;
      }
      requestAnimationFrame(animLoop);
    }
  }

  // ============================================================
  // NAV
  // ============================================================
  function goto(i, animate=true){
    const prevIndex = activeStep;
    const prevStep  = STEPS[prevIndex];
    activeStep = i;
    const s = STEPS[i];
    const goingBack = i < prevIndex;

    // Color-mode defaults
    if(!goingBack){
      if(s.defaultColorMode === 'geom_source'){
        colorMode = 'geom_source';
      } else if(prevStep && prevStep.defaultColorMode === 'geom_source'){
        colorMode = 'attribute';
        if(s.defaultAttr) activeAttr = s.defaultAttr;
      } else if(colorMode === 'geom_source'){
        colorMode = 'attribute';
        if(s.defaultAttr) activeAttr = s.defaultAttr;
      }
    } else {
      if(s.defaultColorMode === 'geom_source'){
        colorMode = 'geom_source';
      } else if(s.defaultAttr){
        colorMode = 'attribute';
        activeAttr = s.defaultAttr;
      }
    }

  const stepCenter = s.view.center || DATA.meta.center;

  map.flyTo({
    ...s.view,
    center: stepCenter,
    zoom: (s.view.zoom ?? map.getZoom()) - zoomOffset(),
    duration: 1100,
    essential: true,
    curve: 1.2
  });
    // Animation policy — heights are CUMULATIVE/persistent.
    //   Forward: animate from prev-step-visible-height to current-step-visible-height
    //            per feature. Buildings that were already visible stay where they
    //            were. Only newly-revealed buildings rise from 0.
    //   Backward: instant snap, no animation.
    //   Material step transitions: same heights as previous step (heightStageFor
    //            handles this), so the rise is a no-op.
    const prevStage = heightStageFor(prevStep);
    const curStage  = heightStageFor(s);

    // Determine if any per-feature height actually changes. If not, skip animation.
    const stagesEqual = prevStage === curStage;

    if(animate && !goingBack && !stagesEqual){
      animFrom = f => effectiveHeightAtStage(f, prevStage);
      animTo   = f => effectiveHeightAtStage(f, curStage);
      animStart = performance.now() + 700;
      animDuration = 1500;
      animFrame++;
    } else {
      animDuration = 0;
      animFrom = f => effectiveHeight(f);
      animTo   = f => effectiveHeight(f);
      animFrame++;
    }

    renderPipeline(); renderPanel(); renderLayers();
    if(animDuration > 0) requestAnimationFrame(animLoop);
  }

  document.getElementById('next').onclick = () => goto(Math.min(activeStep+1, STEPS.length-1));
  document.getElementById('back').onclick = () => goto(Math.max(activeStep-1, 0));
  window.addEventListener('keydown', e => {
    if(e.target.tagName==='BUTTON' || e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight') goto(Math.min(activeStep+1, STEPS.length-1));
    if(e.key==='ArrowLeft')  goto(Math.max(activeStep-1, 0));
  });

  // Collapse the panel (mobile only — toggle is hidden on desktop).
  document.getElementById('panelToggle').addEventListener('click', () => {
    const panel = document.getElementById('panel');
    const collapsed = panel.classList.toggle('collapsed');
    document.getElementById('panelToggle').setAttribute('aria-expanded', String(!collapsed));
  });

  // Swipe the panel left/right to step through. Bound to the panel (not the
  // map) so it never fights map pan/zoom; horizontal intent only.
  (function enablePanelSwipe(){
    const panel = document.getElementById('panel');
    let x0 = null, y0 = null;
    panel.addEventListener('touchstart', e => {
      if(e.touches.length !== 1){ x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, {passive:true});
    panel.addEventListener('touchend', e => {
      if(x0 === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = y0 = null;
      if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
        if(dx < 0) goto(Math.min(activeStep + 1, STEPS.length - 1));
        else       goto(Math.max(activeStep - 1, 0));
      }
    }, {passive:true});
  })();

  init();
  </script>
{% endblock content %}
